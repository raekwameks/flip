<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <!-- These lines make it behave like an app when added to the iPhone home screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flip">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <title>Flip</title>
</head>
<body>
  <main>
    <!-- ===== CHECK TAB: find an item, check prices, work out profit ===== -->
    <section id="tab-check" class="tab active">
      <h1>Check an item</h1>
      <p class="muted">Coming in step 2.</p>
    </section>

    <!-- ===== STOCK TAB: everything you've bought ===== -->
    <section id="tab-stock" class="tab">
      <h1>Stock</h1>
      <p class="muted">Coming in step 6.</p>
    </section>

    <!-- ===== SETTINGS TAB ===== -->
    <section id="tab-settings" class="tab">
      <h1>Settings</h1>
      <p class="muted">Coming in step 5.</p>
      <p class="muted small">App version: <span id="app-version"></span></p>
    </section>
  </main>

  <!-- Bottom tab bar -->
  <nav class="tabbar">
    <button data-tab="check" class="active"><span>🔍</span>Check</button>
    <button data-tab="stock"><span>📦</span>Stock</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>

  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
